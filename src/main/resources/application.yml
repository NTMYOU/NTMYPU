spring:
  application:
    name: NTMYOU
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ntmyou?serverTimezone=UTC
    username: root
    password: akwldrk1

jwt:
  secret: ${JWT_SECRET}

  config:
    import: optional:file:.env  # 환경 변수 파일 로드


springdoc:
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha


# 오류메시지 확인하기
logging:
  level:
    com:
      example:
        ntmyou: DEBUG


